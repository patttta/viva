<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비바! 청춘 문화제 인형뽑기</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      text-align: center;
      padding: 60px;
    }
.logo-wrap {
  text-align: center;
  margin-bottom: 30px;
}
.logo-wrap a {
  display: inline-block;
}
.logo-wrap img {
  max-width: 350px;   /* 로고 최대 크기 */
  width: 100%;
  height: auto;
  cursor: pointer;
}

.description-text {
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.7;
  font-weight: 400;
  color: #8D7860;
  white-space: pre-line;
}
    

    h2 {
      color: #8D7860;
    }

    button {
      padding: 14px 24px;
      font-size: 16px;
      border: none;
      border-radius: 15px;
      color: #fff;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn-fish {
      background: #2BBFEF;
    }
    
    .btn-gather {
      background: #C69B60;
    }

/* 비활성화 상태 */
button:disabled {
  background: #FA8B60;
  cursor: not-allowed;
  opacity: 0.8;
}

    button:hover {
      opacity: 0.9;
    }

.random-wrap {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
}

.random-box {
  width: 100%;
  max-width: 420px;
}

    .result {
      margin-top: 25px;
    }

    .image-box {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 10px;
      margin-bottom: 16px;
    }

    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .result-text {
      margin-top: 12px;
      font-size: 20px;
      font-weight: 600;
      color: #8D7860;
      margin-top: 8px; 
    }

    footer {
      margin-top: 100px;
      font-size: 12px;
      color: #8D7860;
    }

    @keyframes pop {
  0% {
    opacity: 0;
    transform: scale(0.9);
  }
  60% {
    opacity: 1;
    transform: scale(1.05);
  }
  100% {
    transform: scale(1);
  }
}

.pop {
  animation: pop 0.35s ease-out;
}
  </style>
</head>

<body>
  <div class="logo-wrap">
  <a href="">
    <img src="logo.png" alt="로고">
  </a>
</div>

  <div class="random-wrap">

    <div class="random-box">
      <h2>🧸랜덤 인형? 뽑기</h2>
      <button class="btn-fish" onclick="pickRandom(itemsA, 'imageA', 'textA')">
        인형뽑기
      </button>
      <div class="result">
        <div class="image-box">
          <img id="imageA" src="">
        </div>
        <div id="textA" class="result-text"></div>
        <div id="descriptionA" class="description-text"></div>

      </div>
    </div>

  </div>

  <footer>
    © 비바! 청춘
  </footer>

  <script>
      const lastIndexMap = {};
  let remainingClicks = 3;

  function pickRandom(items, imageId, textId) {
    if (remainingClicks <= 0) return;

    let i;
    do {
      i = Math.floor(Math.random() * items.length);
    } while (lastIndexMap[imageId] === i && items.length > 1);

    lastIndexMap[imageId] = i;

    const imgEl = document.getElementById(imageId);
    const textEl = document.getElementById(textId);

    imgEl.src = items[i].img;
    textEl.innerText = items[i].text;
    document.getElementById("descriptionA").innerText =
  items[i].description || "";

    playAnimation(imgEl, textEl);

    remainingClicks--;
    updateButtons();
  }

  function updateButtons() {
    if (remainingClicks <= 0) {
      document.querySelectorAll("button").forEach(btn => {
        btn.disabled = true;
        btn.innerText = "오늘은 여기까지!";
      });
    }
  }
 function playAnimation(imgEl, textEl) {
    imgEl.classList.remove("pop");
    textEl.classList.remove("pop");

    void imgEl.offsetWidth; // 애니메이션 리셋용

    imgEl.classList.add("pop");
    textEl.classList.add("pop");
  }
    const itemsA = [
      {
        img: "1.png",
        text: "햄버거 번(위)를 뽑았다!",
        description: "보상으로 햄버거 번(위)를 받았다."
      },
      {
        img: "2.png",
        text: "햄버거 번(아래)를 뽑았다!",
        description: "보상으로 햄버거 번(아래)를 받았다."
      },
      {
        img: "3.png",
        text: "치즈를 뽑았다!",
        description: "보상으로 치즈 한장을 받았다!"
      },
      {
        img: "4.png",
        text: "양상추를 뽑았다!",
        description: "보상으로 양상추를 받았다!"
      },
      {
        img: "5.png",
        text: "햄버거 패티를 뽑았다!",
        description: "보상으로 햄버거 패티를 받았다!"
      },
      {
        img: "6.png",
        text: "토마토를 뽑았다!",
        description: "보상으로 토마토 한조각을 받았다!"
      },
      {
        img: "7.png",
        text: "고슴도치 만쥬를 뽑았다!",
        description: "지나가던 솔개가 낚아채버렸다! 이런!"
      },
      {
        img: "8.png",
        text: "메론빵을 뽑았다!",
        description: "보상으로 칭찬 스티커 1장을 받았다."
      },
      {
        img: "9.png",
        text: "피자 토스트를 뽑았다!",
        description: "지나가던 사람에게 떨어트려서 세탁비로 칭찬 스티커 3장을 반납했다..."
      },
      {
        img: "10.png",
        text: "소금빵을 뽑았다!",
        description: "보상으로 소금 한포대를 받았다."
      },
        {
        img: "11.png",
        text: "곰팡이 핀 빵을 뽑았다!",
        description: "불꽃놀이용 스파클라를 받았다!"
      },
        {
        img: "12.png",
        text: "빵 클립을 뽑았다!",
        description: "어라 뒤에... 이 편지는 영국에서 최초로 시작되어 일년에 한바퀴를 돌면서 받는 사람에게 행운을 주었고 지금은 당신에게로 옮겨진 이 편지는 4일 안에 당신 곁을 떠나야 합니다. 이 편지를 포함해서 7통을 행운이 필요한 사람에게 보내 주셔야 합니다. 복사를 해도 좋습니다. 혹 미신이라 하실지 모르지만 사실입니다. 영국에서 HGXWCH이라는 사람은 1930년에 이 편지를 받았습니다. 그는 비서에게 복사해서 보내라고 했습니다. 며칠 뒤에 복권이 당첨되어 20억을 받았습니다. 어떤 이는 이 편지를 받았으나 96시간 이내 자신의 손에서 떠나야 한다는 사실을 잊었습니다. 그는 곧 사직되었습니다. 나중에야 이 사실을 알고 7통의 편지를 보냈는데 다시 좋은 직장을 얻었습니다. 미국의 케네디 대통령은 이 편지를 받았지만 그냥 버렸습니다. 결국 9일 후 그는 암살당했습니다. 기억해 주세요. 이 편지를 보내면 7년의 행운이 있을 것이고 그렇지 않으면 3년의 불행이 있을 것입니다. 그리고 이 편지를 버리거나 낙서를 해서는 절대로 안됩니다. 7통입니다. 이 편지를 받은 사람은 행운이 깃들 것입니다. 힘들겠지만 좋은 게 좋다고 생각하세요. 7년의 행운을 빌면서..."
      }

    ];

  
  </script>

</body>
</html>
